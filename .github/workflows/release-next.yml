name: Build Next experimental (manual artifact only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-next-dev.txt
      - run: python run_next.py verify
      - run: python -m pytest tests/next -q -p no:cacheprovider
      - run: python -m PyInstaller --noconfirm --clean LinguaNova_next.spec
      - uses: actions/upload-artifact@v7
        with:
          name: LinguaNovaNext-Windows-experimental
          path: dist/LinguaNovaNext/
# No v* trigger, release write permission, model download or automatic publication.
